services:
  db:
    image: postgres:16-alpine
    container_name: veille-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: veille
      POSTGRES_PASSWORD: veille
      POSTGRES_DB: veille_ao_btp
    # Port volontairement non publié : sur le serveur, le 5432 de l'hôte est
    # déjà pris par le PostgreSQL système. L'app joint la base par le réseau
    # Docker, personne d'autre n'en a besoin.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veille"]
      interval: 10s
      timeout: 5s
      retries: 5

  renov-midi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renov-midi
    restart: unless-stopped
    ports:
      # Écoute sur localhost seulement : l'accès public passe par nginx, qui
      # porte le TLS. Publier sur 0.0.0.0 exposerait l'app en clair.
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: "postgresql://veille:veille@db:5432/veille_ao_btp"
      # Secrets lus depuis .env (non versionné), pas écrits en dur ici.
      SESSION_SECRET: "${SESSION_SECRET}"
      TUNNEL_PASSWORD: "${TUNNEL_PASSWORD}"
      NODE_ENV: "production"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      com.example.description: "Renov Midi - Veille AO BTP"

volumes:
  postgres-data:
    driver: local
