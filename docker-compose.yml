services:
  db:
    image: postgres:16-alpine
    container_name: veille-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: veille
      POSTGRES_PASSWORD: veille
      POSTGRES_DB: veille_ao_btp
    # port non publie : le 5432 de l hote est pris par le postgres systeme
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veille"]
      interval: 10s
      timeout: 5s
      retries: 5

  renov-midi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: "/veille-ao"
    container_name: renov-midi
    restart: unless-stopped
    ports:
      # bind localhost only : l acces public passe par nginx (/veille-ao)
      - "127.0.0.1:3000:3000"
    environment:
      # Database (SQLite in persistent volume)
      DATABASE_URL: "postgresql://veille:veille@veille-db:5432/veille_ao_btp"
      # Session
      SESSION_SECRET: "${SESSION_SECRET}"
      # valeurs dans .env (non versionne)
      TUNNEL_PASSWORD: "${TUNNEL_PASSWORD}"
      # Environment
      NODE_ENV: "production"
      NEXT_PUBLIC_BASE_PATH: "/veille-ao"
    volumes:
      # Persistent SQLite database
      - renov-midi-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/veille-ao"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      com.example.description: "Renov Midi - Veille AO BTP"

volumes:
  renov-midi-data:
    driver: local
  postgres-data:
    driver: local
